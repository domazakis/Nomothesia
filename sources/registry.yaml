# Μητρώο πηγών — ελληνική νομοθεσία για την οδήγηση οχημάτων
#
# Αυτό το αρχείο είναι η μοναδική πηγή αλήθειας του project. Ο κώδικας δεν έχει
# hardcoded URLs ή αριθμούς ΦΕΚ· όλα ζουν εδώ.
#
# ΣΗΜΑΝΤΙΚΟ — το πεδίο `epalithevmeno`:
#   false = τα στοιχεία ΦΕΚ προέρχονται από δευτερογενείς πηγές και ΔΕΝ έχουν
#           ακόμη αντιπαραβληθεί με το επίσημο ΦΕΚ του Εθνικού Τυπογραφείου.
#   true  = το `nomothesia fetch` κατέβασε το ΦΕΚ και επιβεβαίωσε ότι η κεφαλίδα
#           του συμφωνεί με τα στοιχεία της εγγραφής.
# Όσο μια εγγραφή είναι `false`, μην τη θεωρείς αυθεντική.

meta:
  ekdosi: 1
  enimerosi: 2026-08-11
  perigrafi: >-
    Νομοθεσία που αφορά την οδήγηση οχημάτων στην Ελλάδα: κώδικας οδικής
    κυκλοφορίας, άδειες οδήγησης, εκπαίδευση οδηγών, τεχνικός έλεγχος,
    ασφάλιση, επαγγελματική οδήγηση και σχετικό ενωσιακό δίκαιο.

nomothetimata:

  # ─────────────────────────────────────────────────────────────────────────
  # ΘΕΜΑΤΙΚΗ: ΚΩΔΙΚΑΣ ΟΔΙΚΗΣ ΚΥΚΛΟΦΟΡΙΑΣ
  # ─────────────────────────────────────────────────────────────────────────

  - id: kok-5209-2025
    titlos: Κώδικας Οδικής Κυκλοφορίας και άλλες διατάξεις
    syntomos_titlos: ΚΟΚ (ισχύων)
    typos: nomos
    arithmos: "5209"
    etos: 2025
    fek: {teuxos: A, arithmos: 100, imerominia: 2025-06-13}
    thematiki: kok
    proteraiotita: 1
    katastasi: isxyon
    isxys_apo: 2025-09-13
    epalithevmeno: false
    perigrafi: >-
      Ο ισχύων Κώδικας Οδικής Κυκλοφορίας. Καλύπτει κανόνες κυκλοφορίας,
      σήμανση και σηματοδότηση, όρια ταχύτητας, συμπεριφορά οδηγών και πεζών,
      ταξινόμηση και θέση οχημάτων σε κυκλοφορία, ικανότητα οδήγησης και
      έγγραφα απόδειξής της, καθώς και το σύστημα κυρώσεων και σημείων ποινής.
    scheseis:
      antikathista: [kok-2696-1999]
      tropopoieitai_apo: [nomos-5322-2026]
    piges:
      - {typos: fek_pdf, url: "https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20250100100"}
      - {typos: topiko_fek, url: "file:sources/fek/20250100100.pdf"}
      - {typos: kodikopoiimeno_html, url: "https://www.kodiko.gr/nomothesia/document/1181157/nomos-5209-2025"}
    simeioseis: >-
      Δημοσιεύθηκε 13-6-2025. Τα Μέρη Α΄ έως Δ΄ τέθηκαν σε ισχύ τρεις μήνες
      μετά τη δημοσίευση, δηλαδή 13-9-2025, με εξαίρεση τις διατάξεις της
      παρ. 2 του άρθρου 132, οι παραβάσεις των οποίων ισχύουν από 13-6-2025.
      Η ημερομηνία έναρξης ισχύος διαφέρει ανά Μέρος — προσοχή σε ερωτήσεις
      που αφορούν συμβάντα του καλοκαιριού 2025.

  - id: nomos-5322-2026
    titlos: >-
      Προσωπικός Βοηθός, Πρώιμη Παρέμβαση και λοιπές ενεργητικές πολιτικές για
      άτομα με αναπηρία, ρυθμίσεις στεγαστικής πολιτικής και άλλες διατάξεις
    syntomos_titlos: Τροποποιήσεις ΚΟΚ για Ε.Π.Η.Ο.
    typos: nomos
    arithmos: "5322"
    etos: 2026
    fek: {teuxos: A, arithmos: 117, imerominia: 2026-07-24}
    thematiki: kok
    proteraiotita: 1
    katastasi: isxyon
    isxys_apo: 2026-07-24
    epalithevmeno: false
    perigrafi: >-
      Νόμος γενικού περιεχομένου του οποίου τα άρθρα 73-81 τροποποιούν το
      πλαίσιο για τα Ελαφρά Προσωπικά Ηλεκτρικά Οχήματα (Ε.Π.Η.Ο.), με στόχο
      την οδική ασφάλεια και την προστασία τρίτων.
    relevanta_arthra: [73, 74, 75, 76, 77, 78, 79, 80, 81]
    scheseis:
      tropopoiei: [kok-5209-2025]
    piges:
      - {typos: fek_pdf, url: "https://www.et.gr/api/DownloadFeksApi/?fek_pdf=20260100117"}
    simeioseis: >-
      Μόνο τα άρθρα 73-81 αφορούν την οδήγηση. Ο fetcher κατεβάζει ολόκληρο το
      ΦΕΚ αλλά η εξαγωγή περιορίζεται στα άρθρα του `relevanta_arthra`.

